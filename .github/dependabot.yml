version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The lab SP's build image pins a Go patch release. Without this entry the
  # pin only moves when someone remembers, so a Go security fix can sit
  # unapplied in the lab while the root module is already patched.
  - package-ecosystem: docker
    directory: /lab/sp
    schedule:
      interval: weekly
