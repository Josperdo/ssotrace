# golangci-lint v2 configuration.
version: "2"

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose  # unclosed HTTP response bodies (matters once --fetch-jwks exists)
    - errorlint  # errors compared with == instead of errors.Is/As
    - gocritic
    - gosec      # security smells: file permissions, weak crypto, path traversal
    - misspell
    - revive
  settings:
    misspell:
      locale: US
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test fixtures intentionally contain secret-looking strings and use
      # relaxed file handling.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
